name: noor
description: Arabic, tablet-first learning game foundation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '3.13.7'
  flutter: '3.47.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/curriculum/index.json
    - assets/curriculum/approvals.json
    - assets/curriculum/packs/starter.iman.json
    - assets/curriculum/packs/starter.ibadah.json
    - assets/curriculum/packs/starter.seerah.json
    - assets/curriculum/packs/starter.exemplars.json
