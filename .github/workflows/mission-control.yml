name: Mission Control Pages

on:
  push:
    branches:
      - main
      - docs/season-one-mission-control
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-control-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'abdallah-gaber/noor-game' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docs/season-one-mission-control')
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.snapshot.outputs.main_sha }}
      preview_sha: ${{ steps.snapshot.outputs.preview_sha }}
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build current source snapshots
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote origin refs/heads/main refs/heads/docs/season-one-mission-control)
          main_sha=$(awk '$2 == "refs/heads/main" {print $1}' <<< "$refs")
          preview_sha=$(awk '$2 == "refs/heads/docs/season-one-mission-control" {print $1}' <<< "$refs")
          case "$GITHUB_REF" in
            refs/heads/main) event_tip="$main_sha" ;;
            refs/heads/docs/season-one-mission-control) event_tip="$preview_sha" ;;
          esac
          if [[ "$GITHUB_SHA" != "$event_tip" ]]; then
            echo "Skipping an event superseded on its source branch."
            exit 0
          fi
          git fetch --no-tags origin "$main_sha"
          if [[ -n "$preview_sha" ]]; then git fetch --no-tags origin "$preview_sha"; fi
          bash scripts/build_pages.sh _site "$main_sha" "$preview_sha"
          printf 'main_sha=%s\npreview_sha=%s\n' "$main_sha" "$preview_sha" >> "$GITHUB_OUTPUT"
      - name: Upload curated site
        if: steps.snapshot.outputs.main_sha != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.main_sha != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale snapshots
        id: freshness
        env:
          MAIN_SHA: ${{ needs.build.outputs.main_sha }}
          PREVIEW_SHA: ${{ needs.build.outputs.preview_sha }}
        shell: bash
        run: |
          set -euo pipefail
          refs=$(git ls-remote https://github.com/abdallah-gaber/noor-game.git refs/heads/main refs/heads/docs/season-one-mission-control)
          main_tip=$(awk '$2 == "refs/heads/main" {print $1}' <<< "$refs")
          preview_tip=$(awk '$2 == "refs/heads/docs/season-one-mission-control" {print $1}' <<< "$refs")
          if [[ "$MAIN_SHA" == "$main_tip" && "$PREVIEW_SHA" == "$preview_tip" ]]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            echo 'A trusted branch advanced. The newer workflow run will publish its snapshot.'
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@v4
